const meta = RAW.find(d => d.type === "meta") || { interval_s: 5 };
const samples = RAW.filter(d => d.type === "sample");
const events = RAW.filter(d => d.type === "event");
if (!samples.length) { document.body.textContent = "No samples in recording."; throw new Error("empty"); }

const t0 = samples[0].t;
const t1 = Math.max(samples[samples.length - 1].t, t0 + 1);
const COLORS = { green: "#5fbf77", amber: "#e0a836", red: "#e05252", gray: "#8a929c" };

function cls(p) {
  if (p.ph === "Failed" || (p.rs && /CrashLoop|Error/.test(p.rs))) return "red";
  if (p.ph === "Pending") return "gray";
  if (!p.rdy) return "amber";
  return "green";
}

// Precompute per-sample phase counts, restart deltas, metric totals.
const stats = samples.map((s, i) => {
  const c = { green: 0, amber: 0, red: 0, gray: 0 };
  let cpu = 0, mem = 0, hasM = false, delta = false;
  const prev = i ? new Map(samples[i - 1].pods.map(p => [p.ns + "/" + p.n, p.rst])) : null;
  for (const p of s.pods) {
    c[cls(p)]++;
    if (p.cm != null) { cpu += p.cm; mem += p.mm || 0; hasM = true; }
    const key = p.ns + "/" + p.n;
    if (prev && prev.has(key) && p.rst > prev.get(key)) delta = true;
  }
  return { c, cpu: hasM ? cpu : null, mem: hasM ? mem : null, delta };
});
const anyMetrics = stats.some(s => s.cpu != null);
const maxPods = Math.max(...samples.map(s => s.pods.length), 1);
const maxCpu = Math.max(...stats.map(s => s.cpu || 0), 1);
const maxMem = Math.max(...stats.map(s => s.mem || 0), 1);

// Layout
const PAD = 10, W = 900;
const L1 = { y: 14, h: 110 }, L2 = { y: 138, h: 22 }, L3 = { y: 172, h: 22 };
const L4 = { y: 206, h: 66 };
const H = anyMetrics ? L4.y + L4.h + 14 : L3.y + L3.h + 14;
const cv = document.getElementById("cv");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");
const X = t => PAD + (t - t0) / (t1 - t0) * (W - 2 * PAD);
const eventDots = events.map(e => ({ x: X(Math.min(Math.max(e.t, t0), t1)), e }));

let idx = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.font = "10px ui-monospace, monospace";
  ctx.fillStyle = "#586170";
  ctx.fillText("pods by phase", PAD, L1.y - 3);
  ctx.fillText("restarts", PAD, L2.y - 3);
  ctx.fillText("events", PAD, L3.y - 3);

  // Lane 1: stacked phase band, one column per sample.
  for (let i = 0; i < samples.length; i++) {
    const x = X(samples[i].t);
    const xNext = i + 1 < samples.length ? X(samples[i + 1].t) : X(t1) + 2;
    let y = L1.y + L1.h;
    for (const k of ["green", "amber", "gray", "red"]) {
      const h = stats[i].c[k] / maxPods * L1.h;
      if (!h) continue;
      y -= h;
      ctx.fillStyle = COLORS[k];
      ctx.fillRect(x, y, Math.max(xNext - x, 1), h);
    }
  }

  // Lane 2: restart-delta ticks.
  ctx.fillStyle = COLORS.red;
  for (let i = 0; i < samples.length; i++)
    if (stats[i].delta) ctx.fillRect(X(samples[i].t) - 1, L2.y, 2, L2.h);

  // Lane 3: event dots.
  ctx.fillStyle = "#7aa0d4";
  for (const d of eventDots) {
    ctx.beginPath();
    ctx.arc(d.x, L3.y + L3.h / 2, 3, 0, 7);
    ctx.fill();
  }

  // Lane 4: CPU / mem sparklines.
  if (anyMetrics) {
    ctx.fillStyle = "#586170";
    ctx.fillText("cpu (blue, max " + maxCpu + "m) / mem (purple, max " + maxMem + "Mi)", PAD, L4.y - 3);
    for (const [key, max, color] of [["cpu", maxCpu, "#5b9bd5"], ["mem", maxMem, "#a97ad4"]]) {
      ctx.strokeStyle = color;
      ctx.beginPath();
      let pen = false;
      for (let i = 0; i < samples.length; i++) {
        const v = stats[i][key];
        if (v == null) { pen = false; continue; }
        const x = X(samples[i].t), y = L4.y + L4.h - v / max * L4.h;
        pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        pen = true;
      }
      ctx.stroke();
    }
  }

  // Cursor
  ctx.strokeStyle = "#fff";
  ctx.beginPath();
  const cx = X(samples[idx].t);
  ctx.moveTo(cx, 4); ctx.lineTo(cx, H - 4);
  ctx.stroke();
}

function renderTable() {
  const tbody = document.querySelector("#pods tbody");
  tbody.innerHTML = "";
  const pods = [...samples[idx].pods].sort((a, b) => (a.ns + a.n).localeCompare(b.ns + b.n));
  for (const p of pods) {
    const tr = document.createElement("tr");
    tr.className = cls(p);
    for (const v of [p.ns + "/" + p.n, p.ph, p.rdy ? "yes" : "no", p.rst, p.rs || ""]) {
      const td = document.createElement("td");
      td.textContent = String(v);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

const slider = document.getElementById("slider");
slider.max = samples.length - 1;

function setIdx(i) {
  idx = Math.max(0, Math.min(samples.length - 1, i));
  slider.value = idx;
  const d = new Date(samples[idx].t * 1000);
  const off = samples[idx].t - t0;
  document.getElementById("time").textContent =
    d.toLocaleTimeString() + "  (+" + Math.floor(off / 60) + ":" + String(off % 60).padStart(2, "0") + ")  " +
    (idx + 1) + "/" + samples.length;
  draw();
  renderTable();
}

slider.addEventListener("input", () => setIdx(+slider.value));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { setIdx(idx - 1); e.preventDefault(); }
  if (e.key === "ArrowRight") { setIdx(idx + 1); e.preventDefault(); }
});

let timer = null;
const playBtn = document.getElementById("play");
playBtn.addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; playBtn.textContent = "▶ play"; return; }
  playBtn.textContent = "❚❚ pause";
  timer = setInterval(() => {
    if (idx >= samples.length - 1) { clearInterval(timer); timer = null; playBtn.textContent = "▶ play"; return; }
    setIdx(idx + 1);
  }, 150);
});

cv.addEventListener("click", ev => {
  const r = cv.getBoundingClientRect();
  const t = t0 + (ev.clientX - r.left - PAD) / (W - 2 * PAD) * (t1 - t0);
  let best = 0;
  for (let i = 1; i < samples.length; i++)
    if (Math.abs(samples[i].t - t) < Math.abs(samples[best].t - t)) best = i;
  setIdx(best);
});

const tip = document.getElementById("tip");
cv.addEventListener("mousemove", ev => {
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let hit = null;
  if (my >= L3.y && my <= L3.y + L3.h)
    for (const d of eventDots) if (Math.abs(d.x - mx) <= 5) { hit = d.e; break; }
  if (hit) {
    tip.style.display = "block";
    tip.style.left = (ev.clientX + 12) + "px";
    tip.style.top = (ev.clientY + 12) + "px";
    tip.textContent = new Date(hit.t * 1000).toLocaleTimeString() + " " +
      hit.ns + "/" + hit.obj + "\n" + hit.reason + ": " + hit.msg + " (x" + hit.count + ")";
  } else tip.style.display = "none";
});
cv.addEventListener("mouseleave", () => { tip.style.display = "none"; });

setIdx(0);
</script>
